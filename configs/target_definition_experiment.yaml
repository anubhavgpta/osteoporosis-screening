output_prefix: target_definition
cv_folds: 5
seed: 42
bootstrap_iterations: 500
low_bmd_t_score_cutoff: -1.0
recall_target: 0.90
recall_lcb_confidence: 0.95
naive_test_size: 0.20
naive_lasso_selection_c: 0.1
include_smote_naive_subarm: false
n_jobs: 1

# Keep the diagnostic grid small enough to be a sensitivity analysis while still
# reusing the feature-combination candidate machinery and E12 feature contract.
logistic_c: [1.0]
lasso_selection_c: [0.1]
random_forest_min_samples_leaf: [10]
random_forest_max_features: ["sqrt"]
tree_n_estimators: [150]
xgboost_max_depth: [3]
xgboost_learning_rate: [0.04]
xgboost_min_child_weight: [5]
include_stacking: false
include_resampling_candidates: false
