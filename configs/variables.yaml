cycles:
  - {label: "2005-2006", begin_year: 2005, suffix: D}
  - {label: "2007-2008", begin_year: 2007, suffix: E}
  - {label: "2009-2010", begin_year: 2009, suffix: F}
  - {label: "2013-2014", begin_year: 2013, suffix: H}
  - {label: "2017-2018", begin_year: 2017, suffix: J}
files:
  DEMO_H:
    required: true
    columns:
      SEQN: participant_id
      RIAGENDR: sex
      RIDAGEYR: age
      RIDRETH1: race_ethnicity
      DMDEDUC2: education
      INDFMPIR: poverty_income_ratio
