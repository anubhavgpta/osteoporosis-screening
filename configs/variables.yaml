feature_groups:
  age_only: [age]
  demographic: [age, sex, race_ethnicity, education, poverty_income_ratio]
  anthropometric: [bmi, height_cm, weight_kg]
  lifestyle:
    [activity_met_minutes_week, sitting_minutes, alcohol_drinks_week,
     current_smoker, activity_nonresponse, alcohol_nonresponse]
  nutrition:
    [energy_kcal, protein_g, vitamin_e_mg, vitamin_d_mcg, calcium_mg,
     phosphorus_mg, magnesium_mg, calcium_per_1000kcal,
     vitamin_d_per_1000kcal, magnesium_per_1000kcal,
     protein_per_kg, calcium_phosphorus_ratio]
  clinical:
    [prior_fracture_history, parental_hip_fracture,
     long_term_glucocorticoid, menopausal_status, hormone_therapy_ever]
  medical_mobility:
    [arthritis_history, liver_condition, thyroid_problem,
     needs_walking_equipment]
  extended_anthropometric:
    [upper_arm_length_cm, arm_circumference_cm, waist_circumference_cm]
  albumin_chemistry:
    [serum_albumin_g_dl, alkaline_phosphatase_iu_l,
     albumin_alkaline_phosphatase_ratio]
  medication_risk:
    [systemic_glucocorticoid_medication, anticonvulsant_medication,
     aromatase_inhibitor_medication, proton_pump_inhibitor_medication,
     long_term_bone_risk_medication]
  grip: [combined_grip_strength_kg]
  biomarkers:
    [alkaline_phosphatase_iu_l, serum_calcium_mg_dl,
     serum_total_folate_nmol_l, serum_25oh_vitamin_d_nmol_l]
  published_low_bmd_panel:
    [age, sex, poverty_income_ratio, bmi, diabetes_status,
     prior_fracture_history, parental_hip_fracture,
     total_cholesterol_mg_dl, monocyte_percent,
     segmented_neutrophils_percent, mean_cell_volume_fl,
     red_cell_distribution_width_percent, glycohemoglobin_percent,
     alkaline_phosphatase_iu_l, creatine_phosphokinase_iu_l,
     globulin_g_dl, osmolality_mmol_kg, total_protein_g_dl,
     uric_acid_mg_dl]

categorical_features:
  [sex, race_ethnicity, education, current_smoker, age_sex_interaction,
   prior_fracture_history, parental_hip_fracture, long_term_glucocorticoid,
   menopausal_status, hormone_therapy_ever, diabetes_status,
   arthritis_history, rheumatoid_arthritis, liver_condition, thyroid_problem,
   needs_walking_equipment, systemic_glucocorticoid_medication,
   anticonvulsant_medication, aromatase_inhibitor_medication,
   proton_pump_inhibitor_medication, long_term_bone_risk_medication]

