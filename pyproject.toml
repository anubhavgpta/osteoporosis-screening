[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osteoporosis-screening"
version = "0.1.0"
description = "Reproducible survey pipeline for non-invasive osteoporosis screening"
requires-python = ">=3.11"
dependencies = [
  "catboost>=1.2.8",
  "joblib>=1.4",
  "lightgbm>=4.6",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "xgboost>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
literature = ["imbalanced-learn>=0.13", "shap>=0.48"]

[project.scripts]
osteoporosis-pipeline = "osteoporosis_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
